  <path d="M235 250 L240 260 L245 250 Z" fill="#0969da"/>
  <path d="M675 250 L680 260 L685 250 Z" fill="#0969da"/>

  <text x="30" y="252" font-size="12.5" fill="#59636e" letter-spacing="0.6">2 · O QUE O PROJETO RECEBE</text>

  <rect x="70" y="262" width="340" height="118" rx="8" fill="#f6f8fa" stroke="#d1d9e0"/>
  <text x="90" y="286" font-size="12.5" font-weight="600" fill="#1f2328">Claude Code</text>
  <g font-family="ui-monospace,Menlo,monospace" font-size="11" fill="#59636e">
    <text x="90" y="308">.expx/marketplace/plugins/expx/</text>
    <text x="90" y="326">  skills/ + commands/</text>
    <text x="90" y="352" fill="#0969da" font-size="12">/expx:sprintx-sprints</text>
