  <g font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13">
    <rect x="30"  y="48" width="164" height="42" rx="7" fill="#f6f8fa" stroke="#d1d9e0"/>
    <text x="112" y="68" text-anchor="middle" fill="#1f2328">sprintx</text>
    <text x="112" y="82" text-anchor="middle" font-size="10" fill="#59636e" font-family="-apple-system,sans-serif">features novas</text>

    <rect x="204" y="48" width="164" height="42" rx="7" fill="#f6f8fa" stroke="#d1d9e0"/>
    <text x="286" y="68" text-anchor="middle" fill="#1f2328">runx</text>
    <text x="286" y="82" text-anchor="middle" font-size="10" fill="#59636e" font-family="-apple-system,sans-serif">manutencao</text>

    <rect x="378" y="48" width="164" height="42" rx="7" fill="#f6f8fa" stroke="#d1d9e0"/>
    <text x="460" y="68" text-anchor="middle" fill="#1f2328">legadox</text>
    <text x="460" y="82" text-anchor="middle" font-size="10" fill="#59636e" font-family="-apple-system,sans-serif">camada: legado</text>

