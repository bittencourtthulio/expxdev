  <text x="90" y="370" font-size="10.5" fill="#59636e">plugin local, comandos com namespace</text>

  <rect x="510" y="262" width="340" height="118" rx="8" fill="#f6f8fa" stroke="#d1d9e0"/>
  <text x="530" y="286" font-size="12.5" font-weight="600" fill="#1f2328">OpenCode</text>
  <g font-family="ui-monospace,Menlo,monospace" font-size="11" fill="#59636e">
    <text x="530" y="308">.claude/skills/&lt;nome&gt;/</text>
    <text x="530" y="326">.opencode/commands/</text>
    <text x="530" y="352" fill="#0969da" font-size="12">/sprintx-sprints</text>
  </g>
  <text x="530" y="370" font-size="10.5" fill="#59636e">sem namespace: o OpenCode nao tem plugin</text>

