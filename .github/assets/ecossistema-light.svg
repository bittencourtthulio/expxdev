  <path d="M455 138 L460 148 L465 138 Z" fill="#0969da"/>

  <rect x="300" y="150" width="320" height="52" rx="8" fill="#f6f8fa" stroke="#0969da" stroke-width="1.6"/>
  <text x="460" y="172" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-size="14" fill="#0969da">expx init</text>
  <text x="460" y="190" text-anchor="middle" font-size="11" fill="#59636e">busca · normaliza layout · verifica caminhos · trava no lock</text>

  <g stroke="#0969da" stroke-width="1.6" fill="none">
    <path d="M460 202 L460 228"/><path d="M240 228 L680 228"/>
    <path d="M240 228 L240 252"/><path d="M680 228 L680 252"/>
