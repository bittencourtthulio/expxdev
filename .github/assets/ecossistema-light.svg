<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="420" viewBox="0 0 1000 420" role="img" aria-label="O CLI busca as cinco skills, empacota como plugin e configura os dois harnesses">
  <rect width="1000" height="420" rx="12" fill="#ffffff"/>
  <g font-family="-apple-system,Segoe UI,Roboto,sans-serif">

