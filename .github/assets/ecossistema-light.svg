    <text x="634" y="68" text-anchor="middle" fill="#1f2328">stackx</text>
    <text x="634" y="82" text-anchor="middle" font-size="10" fill="#59636e" font-family="-apple-system,sans-serif">camada: dialeto</text>

    <rect x="726" y="48" width="164" height="42" rx="7" fill="#f6f8fa" stroke="#d1d9e0"/>
    <text x="808" y="68" text-anchor="middle" fill="#1f2328">mergex</text>
    <text x="808" y="82" text-anchor="middle" font-size="10" fill="#59636e" font-family="-apple-system,sans-serif">entrega e PR</text>
