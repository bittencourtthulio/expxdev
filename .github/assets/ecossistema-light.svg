  <g stroke="#8c959f" stroke-width="1.2" fill="none" opacity="0.8">
    <path d="M112 90 L112 116 L460 116"/><path d="M286 90 L286 116"/>
    <path d="M460 90 L460 116"/><path d="M634 90 L634 116 L460 116"/>
    <path d="M808 90 L808 116 L460 116"/>
