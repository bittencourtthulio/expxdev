<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300" role="img" aria-label="Instalacao travada por lock; atualizacao explicita que nunca sobrescreve trabalho local">
  <rect width="1000" height="300" rx="12" fill="#ffffff"/>
  <g font-family="-apple-system,Segoe UI,Roboto,sans-serif">

  <rect x="30" y="40" width="280" height="106" rx="8" fill="#f6f8fa" stroke="#d1d9e0"/>
  <text x="52" y="66" font-size="12.5" font-weight="600" fill="#1f2328">Quem clona o projeto</text>
  <text x="52" y="90" font-size="11.5" fill="#59636e">recebe as skills ja em disco</text>
  <text x="52" y="110" font-size="11.5" fill="#59636e">sem rede, sem rodar init</text>
  <text x="52" y="132" font-family="ui-monospace,Menlo,monospace" font-size="11" fill="#3fb950">.expx/ e commitado</text>

  <rect x="360" y="40" width="280" height="106" rx="8" fill="#f6f8fa" stroke="#0969da" stroke-width="1.6"/>
  <text x="382" y="66" font-family="ui-monospace,Menlo,monospace" font-size="13" fill="#0969da">expx-lock.json</text>
  <g font-size="11" fill="#59636e" font-family="ui-monospace,Menlo,monospace">
    <text x="382" y="88">repositorio · referencia</text>
    <text x="382" y="106">commit · resolvido_em</text>
    <text x="382" y="124">sha256 de cada arquivo</text>
  </g>

  <rect x="690" y="40" width="280" height="106" rx="8" fill="#f6f8fa" stroke="#d1d9e0"/>
  <text x="712" y="66" font-size="12.5" font-weight="600" fill="#1f2328">Quem atualiza</text>
  <text x="712" y="90" font-size="11.5" fill="#59636e">ato explicito, com confirmacao</text>
  <text x="712" y="110" font-size="11.5" fill="#59636e">reescreve o lock</text>
  <text x="712" y="132" font-family="ui-monospace,Menlo,monospace" font-size="11" fill="#bc4c00">expx update</text>

  <g stroke="#8c959f" stroke-width="1.3" fill="none" opacity="0.75">
    <path d="M310 93 L352 93"/><path d="M640 93 L682 93"/>
  </g>
  <path d="M350 88 L360 93 L350 98 Z" fill="#8c959f"/>
  <path d="M680 88 L690 93 L680 98 Z" fill="#8c959f"/>

  <rect x="30" y="176" width="940" height="94" rx="8" fill="#f6f8fa" stroke="#d1d9e0"/>
  <text x="52" y="202" font-size="12.5" font-weight="600" fill="#1f2328">O hash por arquivo protege o seu ajuste manual</text>
  <g font-size="11.5" fill="#59636e">
    <text x="52" y="226">Se algum arquivo da skill divergir do lock, o update NAO sobrescreve: lista os arquivos alterados</text>
    <text x="52" y="246">e pede decisao — manter o local, substituir, ou salvar o local ao lado antes de substituir.</text>
  </g>
  <text x="52" y="264" font-family="ui-monospace,Menlo,monospace" font-size="10.5" fill="#3fb950">quem ajustou uma skill a mao nao perde o trabalho por rodar um comando de rotina</text>

  </g>
</svg>
